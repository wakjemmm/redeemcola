<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Coca-Cola</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f7f9fc;
        }
        .card-option {
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .card-option:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .icon {
            font-size: 2.5rem;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="container py-4">

    <!-- Bar atas: info login dan logout -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="mb-0">Login sebagai: <strong>{{ session.username }}</strong></p>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-dark btn-sm">Logout</a>
    </div>

    <h2 class="mb-4 fw-bold text-center">Selamat Datang di Dashboard Coca-Cola</h2>

    <div class="row g-4 justify-content-center">

        <div class="col-md-4">
            <a href="{{ url_for('redeem') }}" style="text-decoration: none;">
                <div class="card card-option text-white bg-danger p-4 text-center">
                    <div class="icon mb-2"><i class="bi bi-gift"></i></div>
                    <h5 class="fw-bold">Redeem Kode</h5>
                    <p>Masukkan kode tutup botol untuk ditukarkan.</p>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="{{ url_for('code_list') }}" style="text-decoration: none;">
                <div class="card card-option text-white bg-primary p-4 text-center">
                    <div class="icon mb-2"><i class="bi bi-qr-code"></i></div>
                    <h5 class="fw-bold">Lihat Kode</h5>
                    <p>Kelola dan lihat semua kode yang tersedia atau sudah digunakan.</p>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="{{ url_for('voucher_list') }}" style="text-decoration: none;">
                <div class="card card-option text-white bg-success p-4 text-center">
                    <div class="icon mb-2"><i class="bi bi-ticket-perforated"></i></div>
                    <h5 class="fw-bold">Voucher</h5>
                    <p>Lihat, tambah, dan edit status voucher Anda.</p>
                </div>
            </a>
        </div>

    </div>
</div>
</body>
</html>
