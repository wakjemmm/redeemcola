<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Statistik Voucher</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f7f9fc;
    }
    .chart-wrapper {
      max-width: 400px;
      margin: auto;
    }
    .top-right {
      position: absolute;
      top: 20px;
      right: 30px;
    }
  </style>
</head>
<body>
<div class="container text-center py-5 position-relative">

  <a href="/" class="btn btn-secondary top-right">← Kembali ke Menu Utama</a>

  <h2 class="mb-5 fw-bold">Statistik Voucher</h2>

  <div class="row justify-content-center mb-5">
    <div class="col-md-4 chart-wrapper mb-5">
      <canvas id="statusChart"></canvas>
      <div class="mt-3">
        <span class="badge bg-danger">Terjual</span>
        <span class="badge bg-success ms-2">Belum Terjual</span>
      </div>
    </div>

    <div class="col-md-4 chart-wrapper mb-5">
      <canvas id="typeChart"></canvas>
      <div class="mt-3">
        {% for label in type_labels %}
          <span class="badge bg-primary me-1">{{ label }}</span>
        {% endfor %}
      </div>
    </div>
  </div>

</div>

<script>
  new Chart(document.getElementById('statusChart'), {
    type: 'pie',
    data: {
      labels: ['Terjual', 'Belum Terjual'],
      datasets: [{
        data: [{{ sold }}, {{ unsold }}],
        backgroundColor: ['#e74c3c', '#27ae60']
      }]
    },
    options: {
      plugins: {
        legend: { display: false },
        title: { display: true, text: 'Status Voucher' }
      }
    }
  });

  new Chart(document.getElementById('typeChart'), {
    type: 'pie',
    data: {
      labels: {{ type_labels | tojson }},
      datasets: [{
        data: {{ type_values | tojson }},
        backgroundColor: ['#3498db', '#9b59b6', '#f1c40f', '#2ecc71', '#e67e22', '#1abc9c']
      }]
    },
    options: {
      plugins: {
        legend: { display: false },
        title: { display: true, text: 'Tipe Voucher' }
      }
    }
  });
</script>
</body>
</html>
