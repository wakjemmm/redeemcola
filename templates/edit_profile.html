<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Edit Profil</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f7f9fc;
    }
    .form-container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    .profile-preview {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="form-container">
    <h3 class="text-center mb-4">Edit Profil</h3>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('edit_profile') }}" enctype="multipart/form-data">
      <div class="text-center">
        {% if current_image %}
          <img src="{{ url_for('static', filename='uploads/' ~ current_image) }}" alt="Foto Profil" class="profile-preview">
        {% else %}
          <img src="https://cdn-icons-png.flaticon.com/512/3177/3177440.png" alt="Default Profile" class="profile-preview">
        {% endif %}
      </div>

      <div class="mb-3">
        <label for="name" class="form-label">Nama</label>
        <input type="text" name="name" id="name" class="form-control" value="{{ current_name }}" required>
      </div>

      <div class="mb-3">
        <label for="profile_image" class="form-label">Foto Profil (opsional)</label>
        <input type="file" class="form-control" id="profile_image" name="profile_image" accept="image/*">
      </div>

      <button type="submit" class="btn btn-primary w-100">Simpan Perubahan</button>
    </form>

    <a href="{{ url_for('index') }}" class="btn btn-link mt-3 w-100">← Kembali ke Menu Utama</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
